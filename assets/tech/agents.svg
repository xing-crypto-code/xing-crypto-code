<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <style>
    @keyframes flt-agents { 0%, 100% { transform: translateY(7px); } 50% { transform: translateY(-7px); } }
    .flt-agents { animation: flt-agents 3.0s ease-in-out infinite; animation-delay: 1.4s; }
    @media (prefers-reduced-motion: reduce) { .flt-agents { animation: none; } }
  </style>
  <g class="flt-agents">
    <g transform="translate(15.36,15.36) scale(0.88)">
      <image x="0" y="0" width="256" height="256" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64," />
    </g>
  </g>
</svg>
