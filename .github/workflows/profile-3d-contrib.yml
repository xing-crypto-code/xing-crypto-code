# 生成 3D 贡献日历 SVG
# 输出到 profile-3d-contrib/，由 README 的 <picture> 标签引用

name: GitHub 3D Contribution Calendar

on:
  schedule:
    - cron: '0 18 * * *'  # 每天 UTC 18:00 (JST 03:00) 自动运行
  workflow_dispatch:       # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 3D contrib image
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated 3D contribution calendar"; then
            git push
          fi
